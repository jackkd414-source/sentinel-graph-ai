# Mirrors the local canonical gate (scripts/verify.sh): tests + typecheck + build.
# Same commands an analyst runs by hand, so CI cannot drift from the docs.
name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend deps (pinned)
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Tests (canonical command, no PYTHONPATH needed)
        run: python -m pytest

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend deps
        run: npm ci
        working-directory: frontend

      - name: Typecheck + production build
        run: npm run build
        working-directory: frontend
